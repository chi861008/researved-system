<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>皮拉提斯排課（格狀版預覽）</title>
<style>
:root{--bg:#f2f4f3;--ink:#17323a;--muted:#5d7178;--line:#d5dcdb;--on:#2a7f78;--onink:#fff;--warn:#a4452c;--card:#fff;--soft:#e3efed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--ink:#e6eeee;--muted:#93a8ac;--line:#2a3b3f;--on:#4fb3a9;--onink:#06201e;--warn:#e58a6f;--card:#16262a;--soft:#1d3a3a}}
:root[data-theme="dark"]{--bg:#0f1b1e;--ink:#e6eeee;--muted:#93a8ac;--line:#2a3b3f;--on:#4fb3a9;--onink:#06201e;--warn:#e58a6f;--card:#16262a;--soft:#1d3a3a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:8px 14px calc(150px + env(safe-area-inset-bottom,0px))}
button,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1{font-size:1.3rem;margin:8px 0 4px}.sub,.hint,.m{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.role{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:8px 0}
.role button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.role button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
details.card summary{font-weight:700;min-height:28px;cursor:pointer}details ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.sec{font-weight:700;margin:18px 0 2px}
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pill{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.pill.on{background:var(--on);border-color:var(--on);color:var(--onink)}.pill.range{border-color:var(--on);color:var(--on);background:var(--soft)}
.pill.off{border-color:var(--warn);color:var(--warn);text-decoration:line-through}.pill.cur{outline:3px solid var(--on);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button,.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:600}
.seg button.n[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.rng{display:flex;gap:8px;align-items:center;margin-top:10px}.rng select,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}.cal i{text-align:center;font-style:normal;color:var(--muted);font-size:.8rem}
.wd{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:0}
.wd.on{background:var(--on);border-color:var(--on);color:var(--onink)}.wd.part{background:var(--soft);border-color:var(--on);color:var(--on)}.wd.cur{outline:3px solid var(--on);outline-offset:2px}
.wbar{display:flex;gap:8px;align-items:center;margin:10px 0 2px}.wbar b{flex:0 0 auto}.wbar .btn{flex:1}.wbar .btn[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}.wbar .btn.n[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.cell.hl{border-color:var(--on);border-style:dashed}
.cell{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0}
.cell small{font-size:.72rem;color:var(--muted);min-height:.9rem}.cell.on{background:var(--soft);border-color:var(--on)}.cell.on small{color:var(--on);font-weight:700}
.cell.cur{outline:3px solid var(--on);outline-offset:1px}.cell:disabled{opacity:.35}
.wnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.wnav button{min-width:52px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.3rem}.wnav button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:50px repeat(7,1fr);gap:3px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gh{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.8rem;padding:0;line-height:1.1}.gh small{display:block;color:var(--muted);font-size:.66rem}.gh:disabled{opacity:.35}
.gc{min-height:36px;border-radius:6px;border:1px solid var(--line);background:var(--card);padding:0}.gc.on{background:var(--on);border-color:var(--on)}.gc.out{border-style:dashed}.gc:disabled{opacity:.3;background:transparent}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:6px}.scope button{min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;line-height:1.25}
.scope small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}.scope button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink)}.scope button[aria-pressed="true"] small{color:var(--onink)}
.scope button[data-v="week"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.grid.gm{outline:2px solid var(--on);outline-offset:5px;border-radius:6px}.grid.gw{outline:2px dashed var(--warn);outline-offset:5px;border-radius:6px}
.toast{background:var(--soft);border-radius:10px;padding:6px 12px;font-size:.88rem;margin:6px 0}
.tin{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font-size:16px}
.tagp{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}.tagp .tag{border:0;border-radius:0}.tagx{border:0;border-left:1px solid var(--line);background:none;min-width:42px;color:var(--muted)}
.li{flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tag{min-height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 14px}.tag[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slots button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}.slots button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow:auto;max-width:520px;margin:0 auto}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.chip{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.chip[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}
.chip.out{border-style:dashed}.chip:disabled{opacity:.35;text-decoration:line-through}
.row{display:flex;gap:8px}.row .btn{flex:1}.btn.pri{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}.btn:disabled{opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:520px;margin:0 auto}.bar label{display:flex;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tabs button{min-height:52px;border:0;background:none;font-size:.95rem}
.tabs button[aria-selected="true"]{color:var(--on);font-weight:700;box-shadow:inset 0 3px 0 var(--on)}
.warn{color:var(--warn)}textarea{width:100%;resize:none;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:8px;font-size:.9rem}
.msg{white-space:pre-wrap;font-size:.9rem;background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.li button{min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.85rem}
.wh{font-weight:700;margin:14px 0 2px}.pillt{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--soft)}
:focus-visible{outline:3px solid var(--on);outline-offset:2px}
</style>
</head>
<body>
<main><div class="role" id="role"></div><div id="view"></div></main>
<div id="foot"></div><div id="sheet"></div>
<script>
var FROM='2026-10-01',TO='2026-10-31',L=60,OPEN=600,LAST=1260,BLK=[{wd:3,s:960,e:1020}];
var WD='日一二三四五六',ORD=[1,2,3,4,5,6,0];
var add=(d,n)=>{var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
var wd=d=>new Date(d+'T00:00:00Z').getUTCDay(),wk=d=>add(d,-((wd(d)+6)%7)),md=d=>(+d.slice(5,7))+'/'+(+d.slice(8));
var hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
var today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
var START=today>FROM?add(wk(today),7):FROM;
var blocked=(d,s)=>BLK.some(b=>b.wd===wd(d)&&s<b.e&&b.s<s+L),okS=(d,s)=>d>=today&&!blocked(d,s);
var starts=[],dates=[];for(var s=OPEN;s<=LAST;s+=L)starts.push(s);for(var d=FROM;d<=TO;d=add(d,1))dates.push(d);
var wks=[];dates.forEach(d=>{if(!wks.includes(wk(d)))wks.push(wk(d))});var wi0=Math.max(0,wks.findIndex(w=>[0,1,2,3,4,5,6].filter(i=>add(w,i)>=today&&add(w,i)<=TO).length>=3));
var mkP=()=>({sel:new Set(),day:null,wi:wi0,scope:'month'});var toast='',notice='',pendAppr=false,outs=[];var LV={a:null,b:null};
var TP=mkP(),SP=mkP();
dates.forEach(d=>starts.forEach(s=>{if(s>=780&&okS(d,s))TP.sel.add(d+'|'+s)}));
var STU=[{id:'s1',name:'Amy',sel:SP.sel},{id:'s2',name:'Bella',pat:[[1,3,5],1080,1260],sel:new Set()},{id:'s3',name:'Cindy',pat:[[2,4],1140,1260],sel:new Set()},{id:'s4',name:'Dora',pat:[[1,2,3,4,5],600,840],sel:new Set()},{id:'s5',name:'Emma',pat:[[6,0],780,1080],sel:new Set()}];
function seedOthers(){STU.forEach(st=>{if(!st.pat)return;dates.forEach(d=>{if(st.pat[0].includes(wd(d)))starts.forEach(s=>{if(s>=st.pat[1]&&s+L<=st.pat[2]&&okS(d,s))st.sel.add(d+'|'+s)})})})}
seedOthers();
var role='student',tab='hours',status='collecting',stale=false,lessons=[],unas=[],uid=0,notified=0,consent=false,sent='';
var ACTP=null,AS=null,PROXY={},NS='',pendHide=null;
var P_=p=>p==='t'?TP:p==='a'?ACTP:SP;
// ---- 每月選課週期 ----
var STN={collecting:'收集中',draft:'草稿',approved:'已核准',notified:'已通知'};
var PER={'2026-10':{status:'collecting',lessons:[],unas:[],notified:0,log:[],deadline:'2026-10-10'}},curYm='2026-10',tYm='2026-10';
var ymEnd=ym=>new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5),0)).toISOString().slice(0,10);
var nextYm=ym=>{var y=+ym.slice(0,4),m=+ym.slice(5)+1;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
var monthDates=ym=>{var o=[];for(var d=ym+'-01';d<=ymEnd(ym);d=add(d,1))o.push(d);return o};
var ymLabel=ym=>ym.slice(0,4)+' 年 '+(+ym.slice(5))+' 月',mon=ym=>+ym.slice(5);
var nowStr=()=>new Date(Date.now()+8*3600e3).toISOString().slice(5,16).replace('T',' ');
function setRange(ym){FROM=ym+'-01';TO=ymEnd(ym);dates.length=0;monthDates(ym).forEach(d=>dates.push(d));wks.length=0;dates.forEach(d=>{if(!wks.includes(wk(d)))wks.push(wk(d))});START=today>FROM?add(wk(today),7):FROM}
var firstWeek=()=>Math.max(0,wks.findIndex(w=>[0,1,2,3,4,5,6].filter(i=>add(w,i)>=today&&add(w,i)>=FROM&&add(w,i)<=TO).length>=3));
function savePer(){var p=PER[curYm];p.status=status;p.lessons=lessons;p.unas=unas;p.notified=notified;p.log=log}
function useMonth(ym){savePer();curYm=ym;var p=PER[ym];status=p.status;lessons=p.lessons;unas=p.unas;notified=p.notified;log=p.log;setRange(ym);TP.wi=SP.wi=firstWeek();TP.day=SP.day=null;SH=null;AS=null;LV.a=LV.b=null}
var statusOf=ym=>ym===curYm?status:PER[ym].status;
var openYm=()=>Object.keys(PER).sort().filter(y=>statusOf(y)==='collecting')[0]||null;
var monthCount=P=>[...P.sel].filter(k=>k.slice(0,7)===curYm).length;
var filled=st=>[...st.sel].some(k=>k.slice(0,7)===curYm);
// 沿用上個月的每週規律：每個「星期×時段」上個月過半數有選，就帶入新月份（個別例外、休假不會帶入）
function carry(P,fromYm,toYm){var fd=monthDates(fromYm),td=monthDates(toYm);
  ORD.forEach(w=>starts.forEach(s=>{var f=fd.filter(d=>wd(d)===w&&!blocked(d,s)),n=f.filter(d=>P.sel.has(d+'|'+s)).length,yes=f.length&&n*2>f.length;
    td.forEach(d=>{if(wd(d)!==w)return;var k=d+'|'+s;if(yes&&okS(d,s))P.sel.add(k);else P.sel.delete(k)})}))}
// ---- 工具 ----
function ranges(ss){var r=[],a=ss[0],b=a+L;for(var i=1;i<ss.length;i++){if(ss[i]===b)b+=L;else{r.push([a,b]);a=ss[i];b=a+L}}r.push([a,b]);return r}
function dayWin(sel,d){var ss=starts.filter(s=>sel.has(d+'|'+s));return ss.length?ranges(ss).map(x=>hm(x[0])+'–'+hm(x[1])).join('、'):''}
function winList(sel,ds){return ds.map(d=>dayWin(sel,d)?md(d)+'（'+WD[wd(d)]+'）'+dayWin(sel,d):'').filter(Boolean)}
// ---- 共用選時段元件 ----
function keysFor(P,d,s){var ds=P.scope==='week'?[0,1,2,3,4,5,6].map(i=>add(wks[P.wi],i)):dates,out=[];
  ds.filter(x=>x>=FROM&&x<=TO&&x>=today&&(d===null||(P.scope==='week'?x===d:wd(x)===wd(d)))).forEach(x=>(s===null?starts:[s]).forEach(y=>{if(okS(x,y))out.push(x+'|'+y)}));return out}
function pick(p){var P=P_(p),w0=wks[P.wi],ds=[0,1,2,3,4,5,6].map(i=>add(w0,i)),live=d=>d>=FROM&&d<=TO&&d>=today,m=P.scope==='month';
  var h='<div class="sec">選擇可以的時間</div>'+
   `<div class="scope" role="group" aria-label="套用範圍"><button data-p="${p}" data-a="scope" data-v="month" aria-pressed="${m}">整個月<small>每週相同</small></button><button data-p="${p}" data-a="scope" data-v="week" aria-pressed="${!m}">只這一週<small>處理例外</small></button></div>`+
   `<p class="m${m?'':' warn'}">${m?'點到的格子會套用到整個月相同的星期和時間，例如點週五 19:00，就是每週五 19:00。再點一次取消。':'只會修改下方這一週，不影響其他週。'}</p>`+(toast?`<p class="toast" role="status">${toast}</p>`:'')+
   `<div class="wnav"><button data-p="${p}" data-a="prev" aria-label="上一週"${P.wi===0?' disabled':''}>‹</button><b>${md(ds[0])} – ${md(ds[6])}</b><button data-p="${p}" data-a="next" aria-label="下一週"${P.wi===wks.length-1?' disabled':''}>›</button></div><div class="grid ${m?'gm':'gw'}"><span></span>`+
   ds.map(d=>`<button class="gh" data-p="${p}" data-a="colT" data-d="${d}"${(m?dates.some(x=>wd(x)===wd(d)&&x>=today):live(d))?'':' disabled'}>${WD[wd(d)]}<small>${m?'每週':md(d)}</small></button>`).join('')+
   starts.map(s=>`<button class="gh" data-p="${p}" data-a="rowT" data-s="${s}">${hm(s)}</button>`+ds.map(d=>{var k=d+'|'+s;return `<button class="gc${P.sel.has(k)?' on':''}${p!=='t'&&!TP.sel.has(k)?' out':''}" data-p="${p}" data-a="cell" data-k="${k}" aria-label="${md(d)} ${hm(s)}"${live(d)&&okS(d,s)?'':' disabled'}></button>`}).join('')).join('')+'</div>'+
   (p!=='t'?'<p class="m">虛線格子是 Joanna 不上班的時段，可能會安排其他老師授課。</p>':'')+'<p class="m">上方切換「整個月」或「只這一週」；左右箭頭可以翻到其他週檢查例外。</p>';
  if(p!=='t'){var a=analyze(P.sel);h+='<div class="card"><b>你目前的選擇</b><div class="m" style="margin:4px 0 0;white-space:pre-wrap">'+(a.runs.length?a.runs.map(r=>r.lab+' '+r.t).join('\n')+(a.off.length?'\n不行：'+a.off.map(md).join('、'):'')+(a.chg.length?'\n調整：'+a.chg.join('、'):''):'還沒有選任何時段')+'</div></div>'}
  return h}
function opt(a,b,c){var h='';for(var m=a;m<=b;m+=L)h+=`<option value="${m}"${m===c?' selected':''}>${hm(m)}</option>`;return h}
function sheet(p){var P=P_(p),d=P.day;if(!d)return '';
  var out=p==='s'&&starts.some(s=>P.sel.has(d+'|'+s)&&!TP.sel.has(d+'|'+s));
  return `<div class="ov" data-a="close" data-p="${p}"></div><div class="sheet" role="dialog" aria-label="${md(d)} 時段"><b>${md(d)}（${WD[wd(d)]}）</b>
  <div class="chips">${starts.map(s=>{var k=d+'|'+s;return `<button class="chip${p==='s'&&!TP.sel.has(k)?' out':''}" data-p="${p}" data-a="chip" data-k="${k}" aria-pressed="${P.sel.has(k)}"${okS(d,s)?'':' disabled'}>${hm(s)}</button>`}).join('')}</div>
  ${p==='s'?`<p class="m${out?' warn':''}">虛線時段 Joanna 不上班，若選這些時段，可能會安排其他老師授課。</p>`:''}
  <div class="row"><button class="btn" data-p="${p}" data-a="allday">整天皆可</button><button class="btn" data-p="${p}" data-a="clearday">清除</button><button class="btn pri" data-p="${p}" data-a="close">完成</button></div></div>`}
// ---- 排課（單一老師；排不進去的列為「待補其他老師」）----
function runSched(){lessons=[];unas=[];
  for(var w=wk(START);w<=TO;w=add(w,7)){var wds=dates.filter(d=>wk(d)===w&&d>=START),seats=[];
    var oth=[];Object.keys(PER).forEach(y=>{if(y!==curYm)PER[y].lessons.forEach(l=>oth.push(l))});
    STU.forEach(st=>{if(st.hidden||lessons.some(l=>l.sid===st.id&&wk(l.d)===w)||oth.some(l=>l.sid===st.id&&wk(l.d)===w)||outs.some(o=>o.sid===st.id&&o.w===w))return;var c=[];
      wds.forEach(d=>starts.forEach(s=>{if(st.sel.has(d+'|'+s)&&TP.sel.has(d+'|'+s)&&!lessons.some(l=>l.d===d&&l.s===s))c.push({k:d+'|'+s,d:d,s:s})}));
      seats.push({st:st,c:c,w:wds})});
    seats.sort((a,b)=>a.c.length-b.c.length);var own={},m={};
    var tryA=(i,v)=>{var c=seats[i].c;for(var j=0;j<c.length;j++){var k=c[j].k;if(v[k])continue;v[k]=1;var o=own[k];if(o===undefined||tryA(o,v)){own[k]=i;return true}}return false};
    seats.forEach((x,i)=>{if(tryA(i,{}))m[i]=1});
    Object.keys(own).forEach(k=>{var q=k.split('|');lessons.push({id:++uid,sid:seats[own[k]].st.id,d:q[0],s:+q[1],locked:false})});

function analyze(sel){var typ={},off=[],chg=[];
  ORD.forEach(w=>{var a=dates.filter(d=>d>=today&&wd(d)===w).map(d=>[d,dayWin(sel,d)]),c={};a.forEach(x=>{if(x[1])c[x[1]]=(c[x[1]]||0)+1});
    var best=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];typ[w]=best;a.forEach(x=>{if(!x[1]){if(best)off.push(x[0])}else if(x[1]!==best)chg.push(md(x[0])+' 改為 '+x[1])})});
  var runs=[];ORD.forEach((w,i)=>{if(!typ[w])return;var l=runs[runs.length-1];if(l&&l.t===typ[w]&&l.ws[l.ws.length-1]===ORD[i-1])l.ws.push(w);else runs.push({t:typ[w],ws:[w]})});
  return{runs:runs.map(r=>{var n=r.ws.length,a=r.ws;return{t:r.t,lab:n===1?'週'+WD[a[0]]:n===2?'週'+WD[a[0]]+'、週'+WD[a[1]]:'週'+WD[a[0]]+'至週'+WD[a[n-1]]}}),off:off.sort(),chg:chg}}

    (log.filter(x=>x.k!=='rem').length?'<div class="sec">之後自動發送的訊息</div>'+log.filter(x=>x.k!=='rem').map(x=>`<div class="card"><span class="m">${x.t} → ${sn(x.sid)}</span><div class="msg">${x.text}</div></div>`).join(''):'')}

function render(){var y=scrollY;
  document.getElementById('role').innerHTML=[['student','學生畫面'],['teacher','老師管理']].map(r=>`<button data-a="role" data-r="${r[0]}" aria-pressed="${role===r[0]}">${r[1]}</button>`).join('');
  document.getElementById('view').innerHTML=role==='student'?vStudent():vTeacher();
  var n=monthCount(SP);
  document.getElementById('foot').innerHTML=role==='student'?(!openYm()?'':`<div class="bar"><div><label><input type="checkbox" data-a="consent"${consent?' checked':''}>我同意工作室使用我的 LINE 名稱與所選時段來安排課程</label><button class="btn pri" style="width:100%" data-a="submit"${!n||!consent?' disabled':''}>送出 ${n} 個可上課時段</button>${sent?`<p class="m" role="status">${sent}</p>`:''}</div></div>`):
    `<div class="bar" style="padding:0 0 env(safe-area-inset-bottom,0px)"><div class="tabs" role="tablist">${[['hours','上班時間'],['students','學生'],['plan','排課'],['notify','通知']].map(t=>`<button role="tab" data-a="tab" data-t="${t[0]}" aria-selected="${tab===t[0]}">${t[1]}</button>`).join('')}</div></div>`;
  var sp=role==='student'?'s':'t';document.getElementById('sheet').innerHTML=role==='teacher'&&SH?adjSheet():sheet(sp);scrollTo(0,y)}
document.addEventListener('click',e=>{var b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.type==='checkbox')return;var a=b.dataset.a,P=b.dataset.p&&P_(b.dataset.p),t=b.dataset.p==='t';if(a==='cell')return;sent='';toast='';notice='';if(a!=='approve')pendAppr=false;if(a!=='hide')pendHide=null;
  if(a==='role'){SH=null;AS=null;role=b.dataset.r;TP.day=SP.day=null;if(role==='student'){var oy=openYm();if(oy)useMonth(oy)}else useMonth(tYm)}
  else if(a==='mprev'||a==='mnext'){var ys=Object.keys(PER).sort();useMonth(ys[ys.indexOf(curYm)+(a==='mnext'?1:-1)]);tYm=curYm}
  else if(a==='openNext'){var ys2=Object.keys(PER).sort(),pv0=ys2[ys2.length-1],nx=nextYm(pv0);PER[nx]={status:'collecting',lessons:[],unas:[],notified:0,log:[],deadline:add(today,7)};useMonth(nx);tYm=nx;seedOthers();carry(TP,pv0,nx);tab='hours';toast='已開放 '+mon(nx)+' 月選課，並帶入上個月的上班時段。請先設定這個月的休假。'}
  else if(a==='addst'){var nn=(NS||'').trim(),ex=STU.filter(x=>x.name===nn)[0];
    if(!nn)notice='請輸入學生名稱。';else if(ex)notice=nn+' 已經在名單裡'+(ex.hidden?'（已隱藏，可以在下方恢復）':'')+'。';
    else{STU.push({id:'s'+(STU.length+1),name:nn,sel:new Set()});NS='';notice='已新增 '+nn+'。可以按「幫他填」先填寫上課時間。'}}
  else if(a==='unhide'){var uh=STU.filter(x=>x.id===b.dataset.id)[0];uh.hidden=false;notice='已恢復 '+uh.name+'。'}
  else if(a==='hide'){var hid0=b.dataset.id,hs=STU.filter(x=>x.id===hid0)[0];savePer();
    var fut=0;Object.keys(PER).forEach(y=>PER[y].lessons.forEach(l=>{if(l.sid===hid0&&l.d>=today)fut++}));
    if(fut&&pendHide!==hid0){pendHide=hid0;notice=hs.name+' 還有 '+fut+' 堂尚未上的課，隱藏後會一併移除。如果確定，請再按一次「確認隱藏」。'}
    else{Object.keys(PER).forEach(y=>{PER[y].lessons=PER[y].lessons.filter(l=>!(l.sid===hid0&&l.d>=today));PER[y].unas=PER[y].unas.filter(u=>u.sid!==hid0)});
      lessons=PER[curYm].lessons;unas=PER[curYm].unas;outs=outs.filter(o=>o.sid!==hid0);hs.hidden=true;pendHide=null;notice='已隱藏 '+hs.name+(fut?'，並移除 '+fut+' 堂尚未上的課':'')+'。'}}
  else if(a==='nmdel'){names=names.filter(x=>x!==b.dataset.n);try{localStorage.setItem('pl_names',JSON.stringify(names))}catch(e){}if(SH&&SH.name===b.dataset.n)SH.name=''}
  else if(a==='actfor'){AS=b.dataset.id;ACTP={sel:STU.filter(x=>x.id===AS)[0].sel,day:null,wi:firstWeek(),scope:'month'}}
  else if(a==='actback')AS=null;
  else if(a==='actdone'){var an=STU.filter(x=>x.id===AS)[0],c0=monthCount(ACTP);if(c0){PROXY[AS+'|'+curYm]=1;notice='已幫 '+an.name+' 儲存 '+c0+' 個時段。'}AS=null}
  else if(a==='carry'){var pv1=Object.keys(PER).sort().filter(y=>y<curYm).pop();carry(P||SP,pv1,curYm);toast='已帶入 '+mon(pv1)+' 月的每週規律，可以再微調個別日期。'}
  else if(a==='remind'){var nf=STU.filter(st=>!st.hidden&&!filled(st));nf.forEach(st=>log.unshift({k:'rem',t:nowStr(),sid:st.id,text:st.name+' 你好 🌸 '+mon(curYm)+' 月的選課還沒收到你的時段喔，請在 '+md(PER[curYm].deadline)+' 前點選下方按鈕填寫，謝謝！🫶🏻'}));notice='已提醒 '+nf.length+' 位尚未填寫的學生。'}
  else if(a==='tab'){tab=b.dataset.t;AS=null}
  else if(a==='cw'){var w=+b.dataset.w;P.cw=P.cw===w?null:w}
  else if(a==='wall'){P.act[P.cw]='on';dates.filter(d=>wd(d)===P.cw).forEach(d=>starts.forEach(s=>okS(d,s)&&P.sel.add(d+'|'+s)));if(t)stale=true}
  else if(a==='wnone'){P.act[P.cw]='off';dates.filter(d=>wd(d)===P.cw).forEach(d=>starts.forEach(s=>P.sel.delete(d+'|'+s)));if(t)stale=true}
  else if(a==='prev')P.wi--;else if(a==='next')P.wi++;
  else if(a==='scope')P.scope=b.dataset.v;
  else if(a==='colT'||a==='rowT'){var col=a==='colT',d0=col?b.dataset.d:null,s0=col?null:+b.dataset.s,ks=keysFor(P,d0,s0),all=ks.length>0&&ks.every(k=>P.sel.has(k));
    ks.forEach(k=>all?P.sel.delete(k):P.sel.add(k));if(P.scope==='month')toast='已'+(all?'取消':'選取')+(col?'整個月每週'+WD[wd(d0)]+'的所有時段':'整個月每天 '+hm(s0));if(t)stale=true}
  else if(a==='leave'){dates.filter(d=>d>=LV.a&&d<=LV.b).forEach(d=>starts.forEach(s=>TP.sel.delete(d+'|'+s)));stale=true;toast='已把 '+md(LV.a)+(LV.a!==LV.b?' – '+md(LV.b):'')+' 設為休假，可以在下方格子細調。'}
  else if(a==='day')P.day=b.dataset.d;
  else if(a==='close')P.day=null;
  else if(a==='chip'){P.sel.has(b.dataset.k)?P.sel.delete(b.dataset.k):P.sel.add(b.dataset.k);if(t)stale=true}
  else if(a==='allday'){starts.forEach(s=>okS(P.day,s)&&P.sel.add(P.day+'|'+s));if(t)stale=true}
  else if(a==='clearday'){starts.forEach(s=>P.sel.delete(P.day+'|'+s));if(t)stale=true}
  else if(a==='copy'){var x=document.getElementById('hm');try{navigator.clipboard.writeText(x.value);b.textContent='已複製'}catch(_){x.select();b.textContent='請長按複製'}return}
  else if(a==='run'){runSched();status='draft';stale=false}
  else if(a==='approve'){if(unas.length&&!pendAppr){pendAppr=true;notice='還有 '+unas.length+' 位次待補其他老師。如果仍要核准，請再按一次「確認核准」。';render();return}pendAppr=false;status='approved'}
  else if(a==='chg')SH={mode:'time',id:+b.dataset.id,key:'',cd:'',ct:'',err:''};
  else if(a==='sub'){var l0=lessons.filter(x=>x.id==+b.dataset.id)[0];SH={mode:'sub',id:l0.id,name:l0.by||'',err:''}}
  else if(a==='fill')SH={mode:'fill',i:+b.dataset.i,name:'',key:'',cd:'',ct:'',err:''};
  else if(a==='nm')SH.name=b.dataset.n;
  else if(a==='pk'){SH.key=b.dataset.k;var q0=SH.key.split('|');SH.cd=q0[0];SH.ct=q0[1];SH.err=''}
  else if(a==='sx')SH=null;
  else if(a==='sok')applySheet();
  else if(a==='send'){notified=1;status='notified'}
  else if(a==='submit')delete PROXY['s1|'+curYm],sent='預覽模式：已模擬送出 '+monthCount(SP)+' 個時段。排好後會在 LINE 個別通知你上課日期、時間及授課老師。';
  else return;render()});
document.addEventListener('change',e=>{var el=e.target,a=el.dataset.a;if(!a)return;
  if(a==='consent'){consent=el.checked;return render()}
  if(a==='lock'){lessons.filter(x=>x.id==+el.dataset.id)[0].locked=el.checked;return render()}
  if(a==='cd'||a==='ct'){if(a==='cd')SH.cd=el.value;else SH.ct=el.value;if(SH.cd&&SH.ct)SH.key=SH.cd+'|'+SH.ct;SH.err='';return render()}
  if(a==='dl'){PER[curYm].deadline=el.value||PER[curYm].deadline;return render()}
  if(a==='la'){LV.a=el.value;if(LV.b<LV.a)LV.b=LV.a;return render()}
  if(a==='lb'){LV.b=el.value;if(LV.b<LV.a)LV.a=LV.b;return render()}
  return});
document.addEventListener('input',e=>{if(e.target.id==='tn'&&SH)SH.name=e.target.value;if(e.target.id==='ns')NS=e.target.value});
var paint=null,pend=null;
function setCell(c){var q=c.dataset.k.split('|');keysFor(paint.P,q[0],+q[1]).forEach(k=>paint.val?paint.P.sel.add(k):paint.P.sel.delete(k));c.classList.toggle('on',paint.val);paint.n=(paint.n||0)+1;paint.q=q}
var endPaint=()=>{if(pend){clearTimeout(pend.timer);pend=null}if(!paint)return;if(paint.p==='t')stale=true;if(paint.P.scope==='month')toast=paint.n===1?'已'+(paint.val?'選取':'取消')+'整個月每週'+WD[wd(paint.q[0])]+' '+hm(+paint.q[1]):'已套用到整個月相同的星期和時間';paint=null;sent='';render()};
document.addEventListener('pointerdown',e=>{toast='';var c=e.target.closest&&e.target.closest('.gc');if(!c||c.disabled)return;var P=P_(c.dataset.p),st={P:P,p:c.dataset.p,val:!P.sel.has(c.dataset.k),last:c.dataset.k,c:c,x:e.clientX,y:e.clientY};
  if(e.pointerType==='mouse'){paint=st;setCell(c);e.preventDefault()}
  else{pend=st;st.timer=setTimeout(()=>{if(pend===st){paint=st;pend=null;setCell(c);if(navigator.vibrate)navigator.vibrate(12)}},300)}});
document.addEventListener('pointermove',e=>{
  if(pend&&(Math.abs(e.clientX-pend.x)>8||Math.abs(e.clientY-pend.y)>8)){clearTimeout(pend.timer);pend=null}
  if(!paint)return;var el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest('.gc');
  if(c&&!c.disabled&&c.dataset.p===paint.p&&c.dataset.k!==paint.last){paint.last=c.dataset.k;setCell(c)}});
document.addEventListener('touchmove',e=>{if(paint)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',()=>{if(pend){paint=pend;clearTimeout(pend.timer);pend=null;setCell(paint.c)}endPaint()});
document.addEventListener('pointercancel',()=>{if(pend){clearTimeout(pend.timer);pend=null}endPaint()});
render();
</script>
