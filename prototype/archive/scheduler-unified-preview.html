<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>皮拉提斯排課（預覽）</title>
<style>
:root{--bg:#f2f4f3;--ink:#17323a;--muted:#5d7178;--line:#d5dcdb;--on:#2a7f78;--onink:#fff;--warn:#a4452c;--card:#fff;--soft:#e3efed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--ink:#e6eeee;--muted:#93a8ac;--line:#2a3b3f;--on:#4fb3a9;--onink:#06201e;--warn:#e58a6f;--card:#16262a;--soft:#1d3a3a}}
:root[data-theme="dark"]{--bg:#0f1b1e;--ink:#e6eeee;--muted:#93a8ac;--line:#2a3b3f;--on:#4fb3a9;--onink:#06201e;--warn:#e58a6f;--card:#16262a;--soft:#1d3a3a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:8px 14px calc(150px + env(safe-area-inset-bottom,0px))}
button,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1{font-size:1.3rem;margin:8px 0 4px}.sub,.hint,.m{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.role{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:8px 0}
.role button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.role button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
details.card summary{font-weight:700;min-height:28px;cursor:pointer}details ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.sec{font-weight:700;margin:18px 0 2px}
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pill{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.pill.on{background:var(--on);border-color:var(--on);color:var(--onink)}.pill.range{border-color:var(--on);color:var(--on);background:var(--soft)}
.pill.off{border-color:var(--warn);color:var(--warn);text-decoration:line-through}.pill.cur{outline:3px solid var(--on);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button,.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:600}
.seg button.n[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.rng{display:flex;gap:8px;align-items:center;margin-top:10px}.rng select,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 8px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}.cal i{text-align:center;font-style:normal;color:var(--muted);font-size:.8rem}
.wd{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;padding:0}
.wd.on{background:var(--on);border-color:var(--on);color:var(--onink)}.wd.part{background:var(--soft);border-color:var(--on);color:var(--on)}.wd.cur{outline:3px solid var(--on);outline-offset:2px}
.wbar{display:flex;gap:8px;align-items:center;margin:10px 0 2px}.wbar b{flex:0 0 auto}.wbar .btn{flex:1}.wbar .btn[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}.wbar .btn.n[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.cell.hl{border-color:var(--on);border-style:dashed}
.cell{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0}
.cell small{font-size:.72rem;color:var(--muted);min-height:.9rem}.cell.on{background:var(--soft);border-color:var(--on)}.cell.on small{color:var(--on);font-weight:700}
.cell.cur{outline:3px solid var(--on);outline-offset:1px}.cell:disabled{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow:auto;max-width:520px;margin:0 auto}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.chip{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.chip[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}
.chip.out{border-style:dashed}.chip:disabled{opacity:.35;text-decoration:line-through}
.row{display:flex;gap:8px}.row .btn{flex:1}.btn.pri{background:var(--on);border-color:var(--on);color:var(--onink);font-weight:700}.btn:disabled{opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:520px;margin:0 auto}.bar label{display:flex;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}.tabs button{min-height:52px;border:0;background:none;font-size:.95rem}
.tabs button[aria-selected="true"]{color:var(--on);font-weight:700;box-shadow:inset 0 3px 0 var(--on)}
.warn{color:var(--warn)}textarea{width:100%;resize:none;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:8px;font-size:.9rem}
.msg{white-space:pre-wrap;font-size:.9rem;background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.li button{min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.85rem}
.wh{font-weight:700;margin:14px 0 2px}.pillt{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--soft)}
:focus-visible{outline:3px solid var(--on);outline-offset:2px}
</style>
</head>
<body>
<main><div class="role" id="role"></div><div id="view"></div></main>
<div id="foot"></div><div id="sheet"></div>
<script>
var FROM='2026-10-01',TO='2026-10-31',L=60,OPEN=600,LAST=1260,BLK=[{wd:3,s:960,e:1020}];
var WD='日一二三四五六',ORD=[1,2,3,4,5,6,0];
var add=(d,n)=>{var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
var wd=d=>new Date(d+'T00:00:00Z').getUTCDay(),wk=d=>add(d,-((wd(d)+6)%7)),md=d=>(+d.slice(5,7))+'/'+(+d.slice(8));
var hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
var today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
var START=today>FROM?add(wk(today),7):FROM;
var blocked=(d,s)=>BLK.some(b=>b.wd===wd(d)&&s<b.e&&b.s<s+L),okS=(d,s)=>d>=today&&!blocked(d,s);
var starts=[],dates=[];for(var s=OPEN;s<=LAST;s+=L)starts.push(s);for(var d=FROM;d<=TO;d=add(d,1))dates.push(d);
var mkP=()=>({sel:new Set(),ws:{},wr:{},day:null,cw:null,act:{}});
var TP=mkP(),SP=mkP();
dates.forEach(d=>starts.forEach(s=>{if(s>=780&&okS(d,s))TP.sel.add(d+'|'+s)}));
function mkS(id,name,days,f,t,me){var P=me?SP:mkP();if(!me)dates.forEach(d=>{if(days.includes(wd(d)))starts.forEach(s=>{if(s>=f&&s+L<=t&&okS(d,s))P.sel.add(d+'|'+s)})});return{id:id,name:name,sel:P.sel}}
var STU=[mkS('s1','Amy',0,0,0,1),mkS('s2','Bella',[1,3,5],1080,1260),mkS('s3','Cindy',[2,4],1140,1260),mkS('s4','Dora',[1,2,3,4,5],600,840),mkS('s5','Emma',[6,0],780,1080)];
var role='student',tab='hours',status='collecting',stale=false,lessons=[],unas=[],uid=0,notified=0,consent=false,sent='';
var P_=p=>p==='t'?TP:SP;
// ---- 工具 ----
function ranges(ss){var r=[],a=ss[0],b=a+L;for(var i=1;i<ss.length;i++){if(ss[i]===b)b+=L;else{r.push([a,b]);a=ss[i];b=a+L}}r.push([a,b]);return r}
function dayWin(sel,d){var ss=starts.filter(s=>sel.has(d+'|'+s));return ss.length?ranges(ss).map(x=>hm(x[0])+'–'+hm(x[1])).join('、'):''}
function winList(sel,ds){return ds.map(d=>dayWin(sel,d)?md(d)+'（'+WD[wd(d)]+'）'+dayWin(sel,d):'').filter(Boolean)}
// ---- 共用選時段元件 ----
function wState(P,w){var e=0,n=0;dates.forEach(d=>{if(wd(d)!==w)return;starts.forEach(s=>{if(okS(d,s)){e++;if(P.sel.has(d+'|'+s))n++}})});return n===0?'':n===e?'on':'part'}
function pick(p){var P=P_(p),cw=P.cw;
  var h='<div class="sec">選擇可以的時間</div><p class="hint">點「一～日」可一次設定整個星期，再點日期調整當天時段。有選的就是可以，沒選的就是不行。日期下的數字是已選時段數。</p><div class="cal">'+
    ORD.map(w=>`<button class="wd ${wState(P,w)}${cw===w?' cur':''}" data-p="${p}" data-a="cw" data-w="${w}" aria-label="每週${WD[w]}" aria-pressed="${cw===w}">${WD[w]}</button>`).join('')+'</div>';
  if(cw!==null)h+=`<div class="wbar"><b>每週${WD[cw]}</b><button class="btn" data-p="${p}" data-a="wall" aria-pressed="${P.act[cw]==='on'&&wState(P,cw)==='on'}">都可以</button><button class="btn n" data-p="${p}" data-a="wnone" aria-pressed="${P.act[cw]==='off'&&wState(P,cw)===''}">都不行</button></div>`;
  h+='<div class="cal" style="margin-top:6px">'+'<span></span>'.repeat((wd(FROM)+6)%7)+
    dates.map(d=>{var n=starts.filter(s=>P.sel.has(d+'|'+s)).length;return `<button class="cell${n?' on':''}${P.day===d?' cur':''}${cw!==null&&wd(d)===cw?' hl':''}" data-p="${p}" data-a="day" data-d="${d}"${d<today?' disabled':''}><span>${+d.slice(8)}</span><small>${n||''}</small></button>`}).join('')+'</div>';
  return h}
function opt(a,b,c){var h='';for(var m=a;m<=b;m+=L)h+=`<option value="${m}"${m===c?' selected':''}>${hm(m)}</option>`;return h}
function sheet(p){var P=P_(p),d=P.day;if(!d)return '';
  var out=p==='s'&&starts.some(s=>P.sel.has(d+'|'+s)&&!TP.sel.has(d+'|'+s));
  return `<div class="ov" data-a="close" data-p="${p}"></div><div class="sheet" role="dialog" aria-label="${md(d)} 時段"><b>${md(d)}（${WD[wd(d)]}）</b>
  <div class="chips">${starts.map(s=>{var k=d+'|'+s;return `<button class="chip${p==='s'&&!TP.sel.has(k)?' out':''}" data-p="${p}" data-a="chip" data-k="${k}" aria-pressed="${P.sel.has(k)}"${okS(d,s)?'':' disabled'}>${hm(s)}</button>`}).join('')}</div>
  ${p==='s'?`<p class="m${out?' warn':''}">虛線時段 Joanna 不上班，若選這些時段，可能會安排其他老師授課。</p>`:''}
  <div class="row"><button class="btn" data-p="${p}" data-a="allday">整天皆可</button><button class="btn" data-p="${p}" data-a="clearday">清除</button><button class="btn pri" data-p="${p}" data-a="close">完成</button></div></div>`}
// ---- 排課（單一老師；排不進去的列為「待補其他老師」）----
function runSched(){lessons=lessons.filter(l=>l.locked);unas=[];
  for(var w=wk(START);w<=TO;w=add(w,7)){var wds=dates.filter(d=>wk(d)===w&&d>=START),seats=[];
    STU.forEach(st=>{if(lessons.some(l=>l.sid===st.id&&wk(l.d)===w))return;var c=[];
      wds.forEach(d=>starts.forEach(s=>{if(st.sel.has(d+'|'+s)&&TP.sel.has(d+'|'+s)&&!lessons.some(l=>l.d===d&&l.s===s))c.push({k:d+'|'+s,d:d,s:s})}));
      seats.push({st:st,c:c,w:wds})});
    seats.sort((a,b)=>a.c.length-b.c.length);var own={},m={};
    var tryA=(i,v)=>{var c=seats[i].c;for(var j=0;j<c.length;j++){var k=c[j].k;if(v[k])continue;v[k]=1;var o=own[k];if(o===undefined||tryA(o,v)){own[k]=i;return true}}return false};
    seats.forEach((x,i)=>{if(tryA(i,{}))m[i]=1});
    Object.keys(own).forEach(k=>{var q=k.split('|');lessons.push({id:++uid,sid:seats[own[k]].st.id,d:q[0],s:+q[1],locked:false})});
    seats.forEach((x,i)=>{if(!m[i]){var all=winList(x.st.sel,x.w);unas.push({sid:x.st.id,w:w,why:x.c.length?'Joanna 的時段被其他學生佔滿':all.length?'學生選的時段 Joanna 不上班':'這週沒有選時段',wins:all})}})}
  lessons.sort((a,b)=>a.d.localeCompare(b.d)||a.s-b.s)}
var sn=id=>STU.filter(s=>s.id===id)[0].name;
// ---- 發給學生的上班時間 ----
function hoursMsg(){var typ={},off=[],chg=[];
  ORD.forEach(w=>{var a=dates.filter(d=>d>=today&&wd(d)===w).map(d=>[d,dayWin(TP.sel,d)]),c={};a.forEach(x=>{if(x[1])c[x[1]]=(c[x[1]]||0)+1});
    var best=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];typ[w]=best;a.forEach(x=>{if(!x[1]){if(best)off.push(x[0])}else if(x[1]!==best)chg.push(md(x[0])+' 改為 '+x[1])})});
  var runs=[];ORD.forEach((w,i)=>{if(!typ[w])return;var l=runs[runs.length-1];if(l&&l.t===typ[w]&&l.ws[l.ws.length-1]===ORD[i-1])l.ws.push(w);else runs.push({t:typ[w],ws:[w]})});
  var lines=runs.map(r=>{var n=r.ws.length,a=r.ws,lab=n===1?'週'+WD[a[0]]:n===2?'週'+WD[a[0]]+'、週'+WD[a[1]]:'週'+WD[a[0]]+'至週'+WD[a[n-1]];
    var e=r.t.split('、').pop().split('–')[1],em=+e.slice(0,2)*60+(+e.slice(3));return lab+' '+r.t+'（最後一堂 '+hm(em-L)+' 開始）'});
  return '👩🏻 Joanna 10 月可預約時段\n'+(lines.join('\n')||'本月無上班')+(off.length?'\n🚫 休假（無法預約）：'+off.sort().map(md).join('、'):'')+(chg.length?'\n⏰ 時段調整：'+chg.join('、'):'')+'\n\n🚫 固定無法預約：每週三 16:00–17:00（公司開會）\n💡 Joanna 不上班的時段若有需要，會安排其他老師授課。'}
// ---- 畫面 ----
function vStudent(){return `<h1>🌸 10 月皮拉提斯選課開始囉！</h1><p class="sub">請勾選這個月所有可以上課的日期與時間，並於 10/10 前完成。我們會在 27 日前安排完成，並用 LINE 個別通知你上課日期、時間及授課老師。</p>
  <details class="card" open><summary>選課規則與時間說明</summary><ul><li>營業時間 10:00–22:00，最後一堂 21:00 開始；每週三 16:00–17:00 公司開會</li><li>Joanna 可預約 13:00–22:00（虛線時段 Joanna 不上班，可能由其他老師授課）</li><li>每堂 60 分鐘，原則上每週一堂</li><li>平日晚上是熱門時段，選得越多越容易安排，但不保證排到第一志願</li><li>送出不代表預約完成，請以正式課表為準</li><li>時間都無法安排時，我們會另外與你聯絡</li></ul></details>`+pick('s')}
function vTeacher(){
  if(tab==='hours'){var m=hoursMsg();return `<h1>上班時間</h1><p class="hint">設定方式和學生選時段相同，預設整個月都上班，再扣掉休假日。</p>`+pick('t')+
    `<div class="sec">發給學生的上班時間</div><p class="hint">會隨上方設定自動更新</p><textarea id="hm" readonly rows="${m.split('\n').length+1}">${m}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-a="copy">複製訊息</button></div>`}
  if(tab==='plan'){var lock=status==='approved'||status==='notified',h=`<h1>排課</h1><div class="row"><button class="btn pri" data-a="run"${lock?' disabled':''}>自動排課</button><button class="btn" data-a="approve"${!lessons.length||lock?' disabled':''}>核准課表</button>${lock&&status!=='notified'?'<button class="btn" data-a="reopen">退回修改</button>':''}</div>`;
    if(stale&&!lock)h+='<p class="warn">上班時間已變更，建議重新排課（已鎖定的課會保留）。</p>';
    if(!lessons.length&&!unas.length)return h+'<p class="hint">按「自動排課」產生草稿。只排 Joanna，排不進去的會列在「待補其他老師」。</p>';
    h+=`<p>已排入 <b>${lessons.length}</b> 堂，待補其他老師 <b class="${unas.length?'warn':''}">${unas.length}</b> 位次</p>`;var cur='';
    lessons.forEach(l=>{var w=wk(l.d);if(w!==cur){cur=w;h+=`<div class="wh">${md(w)} 起這週</div>`}
      h+=`<div class="li"><span>${md(l.d)}（${WD[wd(l.d)]}）${hm(l.s)} ${sn(l.sid)}</span><span><label><input type="checkbox" data-a="lock" data-id="${l.id}"${l.locked?' checked':''}${lock?' disabled':''}> 鎖定</label> <button data-a="out" data-id="${l.id}"${lock||l.locked?' disabled':''}>請人代</button></span></div>`});
    if(unas.length){h+='<div class="card"><b class="warn">待補其他老師</b>';unas.forEach(u=>{h+=`<div class="li" style="display:block"><b>${sn(u.sid)}</b>　${md(u.w)} 起這週<br><span class="m">${u.why}${u.wins.length?'<br>可上課：'+u.wins.join('；'):''}</span></div>`});h+='</div>'}
    return h}
  if(status!=='approved'&&status!=='notified')return '<h1>通知</h1><p class="hint">請先在「排課」核准課表，核准後才會產生學生通知。</p>';
  return '<h1>通知</h1><p class="hint">每位學生會在 LINE 收到自己的課表，不會傳到群組。</p>'+STU.map(s=>{var ls=lessons.filter(l=>l.sid===s.id),n=unas.filter(u=>u.sid===s.id).length;
    return `<div class="card"><b>${s.name}</b> ${notified?'<span class="pillt">已通知</span>':''}<div class="msg">${s.name} 你好 🌸\n這是你 10 月的上課時間：\n${ls.map(l=>md(l.d)+'（'+WD[wd(l.d)]+'）'+hm(l.s)+'–'+hm(l.s+L)+'　Joanna 老師').join('\n')}${n?'\n另有 '+n+' 週的課還在安排授課老師，確定後會再通知你。':''}</div></div>`}).join('')+`<button class="btn pri" style="width:100%" data-a="send"${notified?' disabled':''}>模擬推播給全部學生</button>`}
function render(){var y=scrollY;
  document.getElementById('role').innerHTML=[['student','學生畫面'],['teacher','老師管理']].map(r=>`<button data-a="role" data-r="${r[0]}" aria-pressed="${role===r[0]}">${r[1]}</button>`).join('');
  document.getElementById('view').innerHTML=role==='student'?vStudent():vTeacher();
  var n=SP.sel.size;
  document.getElementById('foot').innerHTML=role==='student'?`<div class="bar"><div><label><input type="checkbox" data-a="consent"${consent?' checked':''}>我同意工作室使用我的 LINE 名稱與所選時段來安排課程</label><button class="btn pri" style="width:100%" data-a="submit"${!n||!consent?' disabled':''}>送出 ${n} 個可上課時段</button>${sent?`<p class="m" role="status">${sent}</p>`:''}</div></div>`:
    `<div class="bar" style="padding:0 0 env(safe-area-inset-bottom,0px)"><div class="tabs" role="tablist">${[['hours','上班時間'],['plan','排課'],['notify','通知']].map(t=>`<button role="tab" data-a="tab" data-t="${t[0]}" aria-selected="${tab===t[0]}">${t[1]}</button>`).join('')}</div></div>`;
  var sp=role==='student'?'s':'t';document.getElementById('sheet').innerHTML=sheet(sp);scrollTo(0,y)}
document.addEventListener('click',e=>{var b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.type==='checkbox')return;var a=b.dataset.a,P=b.dataset.p&&P_(b.dataset.p),t=b.dataset.p==='t';sent='';
  if(a==='role'){role=b.dataset.r;TP.day=SP.day=null}
  else if(a==='tab')tab=b.dataset.t;
  else if(a==='cw'){var w=+b.dataset.w;P.cw=P.cw===w?null:w}
  else if(a==='wall'){P.act[P.cw]='on';dates.filter(d=>wd(d)===P.cw).forEach(d=>starts.forEach(s=>okS(d,s)&&P.sel.add(d+'|'+s)));if(t)stale=true}
  else if(a==='wnone'){P.act[P.cw]='off';dates.filter(d=>wd(d)===P.cw).forEach(d=>starts.forEach(s=>P.sel.delete(d+'|'+s)));if(t)stale=true}
  else if(a==='day')P.day=b.dataset.d;
  else if(a==='close')P.day=null;
  else if(a==='chip'){P.sel.has(b.dataset.k)?P.sel.delete(b.dataset.k):P.sel.add(b.dataset.k);if(t)stale=true}
  else if(a==='allday'){starts.forEach(s=>okS(P.day,s)&&P.sel.add(P.day+'|'+s));if(t)stale=true}
  else if(a==='clearday'){starts.forEach(s=>P.sel.delete(P.day+'|'+s));if(t)stale=true}
  else if(a==='copy'){var x=document.getElementById('hm');try{navigator.clipboard.writeText(x.value);b.textContent='已複製'}catch(_){x.select();b.textContent='請長按複製'}return}
  else if(a==='run'){runSched();status='draft';stale=false}
  else if(a==='approve'){if(unas.length&&!confirm('還有 '+unas.length+' 位次待補其他老師，仍要核准嗎？'))return;status='approved'}
  else if(a==='reopen')status='draft';
  else if(a==='out'){var l=lessons.filter(x=>x.id==+b.dataset.id)[0];lessons=lessons.filter(x=>x!==l);unas.push({sid:l.sid,w:wk(l.d),why:'你手動移出，需另外安排老師',wins:winList(STU.filter(s=>s.id===l.sid)[0].sel,dates.filter(d=>wk(d)===wk(l.d)&&d>=START))})}
  else if(a==='send'){notified=1;status='notified'}
  else if(a==='submit')sent='預覽模式：已模擬送出 '+SP.sel.size+' 個時段。排好後會在 LINE 個別通知你上課日期、時間及授課老師。';
  else return;render()});
document.addEventListener('change',e=>{var el=e.target,a=el.dataset.a;if(!a)return;
  if(a==='consent'){consent=el.checked;return render()}
  if(a==='lock'){lessons.filter(x=>x.id==+el.dataset.id)[0].locked=el.checked;return render()}
  return});
render();
</script>
</body>
</html>
